[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "normst"
version = "1.0.0"
description = "Histology-guided super-resolution of spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "Jiachen Ye"}]
dependencies = ["numpy>=1.26", "scipy>=1.12", "torch>=2.5", "filelock>=3.29.4"]

[project.optional-dependencies]
histology = ["timm>=1.0", "safetensors>=0.4", "Pillow>=10", "tifffile>=2024.1", "h5py>=3.10"]

[project.scripts]
normst = "normst.cli:main"

[project.urls]
Repository = "https://github.com/jiachenye-cuilab/NORMST"

[tool.setuptools.packages.find]
include = ["normst*"]

[tool.setuptools.package-data]
normst = ["defaults.json"]
